name: Check

# Runs on every push and pull request so problems show up on GitHub
# before Cloudflare Pages tries to build and deploy.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Lint
        run: npm run lint
      - name: Build frontend
        run: npm run build
      - name: Build Cloudflare Functions
        run: npm run build:functions
